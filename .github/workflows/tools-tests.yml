name: Tools tests

# The performance and provenance tooling's own self-tests (synthetic samples, temporary git repositories);
# standard library only, about a minute. Runs in the smoke tier only when tools/ changed (paths filter), and
# always in the full tier (ci-full.yml calls this workflow). Honours CI_MODE=off.

on:
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/tools-tests.yml']
  pull_request:
    branches: [main]
    paths: ['tools/**', '.github/workflows/tools-tests.yml']
  workflow_call:

concurrency:
  group: tools-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    if: ${{ vars.CI_MODE != 'off' && !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (tools/perf)
        run: python -m unittest discover -s tools/perf -v
      - name: Unit tests (tools/provenance)
        run: python -m unittest discover -s tools/provenance -v
