name: CI

# Smoke tier: one Linux job on every push to main and every pull request (docs/ci-strategy.md). The full tier
# (other compilers and platforms, sanitizers, long suites, provenance) is ci-full.yml. Performance is not
# measured in CI: the local gate owns it.
# Off switch: repository variable CI_MODE=off (or [skip ci] in a commit message, or the ci:skip label).

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'NOTICE*'
      - '.ci/**'
  pull_request:
    branches: [main]
    # labeled/unlabeled re-evaluate the ci/policy status (ci:local-verified, ci:skip); they do not rebuild.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'NOTICE*'
      - '.ci/**'

concurrency:
  group: ci-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    # The pinned ref is the commit of CraigHutchinson/.github that holds the reusable workflows.
    uses: CraigHutchinson/.github/.github/workflows/cpp-smoke.yml@789478c64113b201e518810a3ef6fbf1bf1b1b90
    with:
      apt-packages: g++-14 ninja-build ccache
      cpm-cache-key-files: CMakeLists.txt tests/CMakeLists.txt cmake/Sub0MathTooling.cmake
      extra-cmake-args: -DSUB0MATH_WARNINGS_AS_ERRORS=ON -DSUB0MATH_BUILD_BENCHMARKS=OFF -DSUB0MATH_PERF_ON_BUILD=OFF -DSUB0MATH_PERF_GIT_HOOKS=OFF
    permissions: { contents: read, statuses: write, actions: read, pull-requests: read, checks: read }
